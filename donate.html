<!DOCTYPE html>
<html lang="en-US">
	<head>
		<!-- Google tag (gtag.js) -->
		<script async src="https://www.googletagmanager.com/gtag/js?id=G-SYR26MG6YV"></script>
		<script>
			window.dataLayer = window.dataLayer || [];
			function gtag(){dataLayer.push(arguments);}
			gtag('js', new Date());
			
			gtag('config', 'G-SYR26MG6YV');
		</script>
		<meta charset="utf-8">
		<title>Donate - BlenderTimer</title>
		<meta name="description" content="Support free tools, resources, and content by supporting BlenderTimer!">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<link rel="icon" href="/favicon.png" type="image/x-icon">
		<link rel="stylesheet" type="text/css" href="/static/defaults/theme.css">
		<link rel="stylesheet" type="text/css" href="/static/main.css">
		<link rel="stylesheet" type="text/css" href="/static/donate.css">
		<script src="/bt-js/bt-js.js"></script>
	</head>
	<body>
		<header></header>
		<script src="/static/defaults/pages.js"></script>
		<noscript>
			<div id="nojs" style="position: fixed; top: 0px; bottom: 0px; left: 0px; right: 0px; display: flex; flex-flow: column; justify-content: center; align-items: center; background: var(--bgcol); padding: 15px 20px; z-index: 1000000; cursor: default;">
				<b style="font-family: sans-serif; font-size: 16pt; color: #FFF; text-align: center;">Page Failed to Load</b>
				<p style="font-family: sans-serif; font-size: 14pt; color: #FFF6; text-align: center;">This website requires Javascript to operate.</p>
			</div>
		</noscript>
		<div id="loader" style="width: 100%; height: calc(100% - 50px); top: 50px; left: 0px; position: fixed; z-index: -100000;">
			<img alt="Loading" src="/static/images/loader.gif" style="width: 100px; height: 100px; position: fixed; left: calc(50% - 50px); top: calc(50% - 25px); filter: drop-shadow(0px 0px 15px #000000);">
		</div>
		<div id="content-main" class="limwidth" style="opacity: 0; transition: 0.5s">
			<div id="donate-main">
				<h1>Join the Supporters!</h1>
				<img id="heart" src="/static/images/icons/heart-color-outlined.svg" alt="Heart icon">
				<p>Creating free content takes a lot of time and effort, and your support keeps it alive! If my content has helped or inspired you, consider supporting me with a one-time donation or by becoming a monthly YouTube member!</p>
				<div id="donate-options">
					<div id="paypal">
						<h1>PayPal</h1>
						<div id="paypal-options">
							<label onclick="setPaypalDonation(event)"><input type="radio" name="paypal-option"><span>$1</span></label>
							<label onclick="setPaypalDonation(event)"><input type="radio" name="paypal-option"><span>$5</span></label>
							<label onclick="setPaypalDonation(event)"><input type="radio" name="paypal-option" checked><span>$10</span></label>
							<label onclick="setPaypalDonation(event)"><input type="radio" name="paypal-option"><span>$20</span></label>
							<label onclick="setPaypalDonation(event)"><input type="radio" name="paypal-option"><span>$30</span></label>
							<label onclick="setPaypalDonation(event)"><input type="radio" name="paypal-option"><span>$50</span></label>
							<label onclick="setPaypalDonation(event)"><input type="radio" name="paypal-option"><span>$70</span></label>
							<label onclick="setPaypalDonation(event)"><input type="radio" name="paypal-option"><span>$100</span></label>
						</div>
						<a href="https://www.paypal.com/donate?business=inquiries@blendertimer.com&no_recurring=0&amount=10" id="paypal-donate">Donate</a>
					</div>
					<div id="youtube">
						<h1>YouTube Memberships</h1>
						<div id="youtube-options">
							<label><input type="radio" name="youtube-option"><span>$2<i>Supersonic</i></span></label>
							<label><input type="radio" name="youtube-option" checked><span>$4<i>Hypersonic</i></span></label>
							<label><input type="radio" name="youtube-option"><span>$6<i>Lightspeed</i></span></label>
							<label><input type="radio" name="youtube-option"><span>$15<i>Infinite Speed</i></span></label>
						</div>
						<i>per month</i>
						<a href="https://www.youtube.com/BlenderTimer/join" id="youtube-donate">Join</a>
					</div>
				</div>
				<br>
				<script src="/general-data/supporters.js"></script>
				<script>
					const donateMain = document.getElementById('donate-main');
					const tier4 = supporters.filter(s => s.tier === 4);
					const tier3 = supporters.filter(s => s.tier === 3);
					const tier2 = supporters.filter(s => s.tier === 2);
					const tier1 = supporters.filter(s => s.tier === 1);
					const tier0 = supporters.filter(s => s.tier === 0);
					let supportersHTML = `
						${tier4.length > 0 ? `<h2>Infinite Speed Members (${tier4.length.toLocaleString()})</h2>
						<div id="tier4-members">${tier4.map(s => `<b>${s.name}</b>`).join('')}</div>` : ''}
						${tier3.length > 0 ? `<h2>Lightspeed Members (${tier3.length.toLocaleString()})</h2>
						<div id="tier3-members">${tier3.map(s => `<b>${s.name}</b>`).join('')}</div>` : ''}
						${tier2.length > 0 ? `<h2>Hypersonic Members (${tier2.length.toLocaleString()})</h2>
						<div id="tier2-members">${tier2.map(s => `<b>${s.name}</b>`).join('')}</div>` : ''}
						${tier1.length > 0 ? `<h2>Supersonic Members (${tier1.length.toLocaleString()})</h2>
						<div id="tier1-members">${tier1.map(s => `<b>${s.name}</b>`).join('')}</div>` : ''}
						${tier0.length > 0 ? `<h2>One-Time Supporters (${tier0.length.toLocaleString()})</h2>
						<div id="ot-supporters">${tier0.map(s => `<b>${s.name}</b>`).join('')}</div>` : ''}`;
					donateMain.innerHTML += supportersHTML;
				</script>
			</div>
		</div>
		<footer></footer>
		<script src="/static/defaults/headerfooter-loader.js"></script>
		<script src="/static/main.js"></script>
		<script src="/static/donate.js"></script>
	</body>
</html>
